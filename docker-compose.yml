services:
  algo-arena:
    build: .
    container_name: algo-arena
    ports:
      - "3000:3000"
    volumes:
      # SQLite database lives here so it survives container rebuilds.
      - ./data:/app/data
    environment:
      - DB_PATH=/app/data/app.db
      - JUDGE_UID=1001
      - JUDGE_GID=1001
    # Lock down the data dir to root-only: judge processes (uid 1001) must
    # never be able to read the accounts DB or users' progress files.
    command: sh -c "chmod 700 /app/data && exec node_modules/.bin/next start"
    restart: unless-stopped
